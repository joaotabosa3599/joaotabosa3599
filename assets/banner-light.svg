<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="João Tabosa, Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#f0f0f3"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7f5af5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7f5af5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a48bfb"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#7f5af5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#111318" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
    <clipPath id="type"><rect id="typeRect" x="72" y="150" width="0" height="40">
      <animate attributeName="width" from="0" to="330" dur="1.6s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.4 1"/>
    </rect></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- aurora blobs -->
    <g>
      <circle cx="260" cy="60" r="260" fill="url(#g1)">
        <animate attributeName="cx" values="260;340;260" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;120;60" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="300" r="300" fill="url(#g2)">
        <animate attributeName="cx" values="1000;900;1000" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="300;220;300" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="-40" r="220" fill="url(#g3)">
        <animate attributeName="cx" values="700;640;700" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- left: text -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#8a8d96">
        <text x="72" y="74" opacity="0">
          <tspan fill="#a48bfb">const</tspan> dev <tspan fill="#5eead4">=</tspan> {
          <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.1s" fill="freeze"/>
        </text>
        <text x="72" y="307" opacity="0">}
          <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.5s" fill="freeze"/>
        </text>
      </g>

      <text x="72" y="130" font-size="64" font-weight="800" fill="#111318" letter-spacing="-2" opacity="0">João Tabosa
        <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.7s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
      </text>

      <g clip-path="url(#type)">
        <text x="72" y="181" font-size="28" font-weight="500" fill="url(#accent)" textLength="320" lengthAdjust="spacing">Full Stack Developer</text>
      </g>
      <rect x="72" y="156" width="3" height="30" fill="#5eead4" opacity="0">
        <animate attributeName="x" from="72" to="400" dur="1.6s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.4 1"/>
        <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.5s" fill="freeze"/>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" begin="2.2s" repeatCount="indefinite"/>
      </rect>

      <text x="72" y="222" font-size="17" fill="#4b4e57" opacity="0">Construo aplicações web do banco de dados à interface.
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.9s" fill="freeze"/>
      </text>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.2s" fill="freeze"/>
        <rect x="72" y="248" width="432" height="34" rx="17" fill="#111318" fill-opacity="0.04" stroke="#111318" stroke-opacity="0.12"/>
        <circle cx="94" cy="265" r="4" fill="#34d399">
          <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="108" y="270" font-size="13.5" fill="#2b2e36" letter-spacing="0.2" textLength="380" lengthAdjust="spacing">Engenharia da Computação · Universidade Federal do Ceará</text>
      </g>
    </g>

    <!-- right: stack illustration -->
    <g transform="translate(830 48)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
      <!-- data flow lines -->
      <g stroke="url(#flow)" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M150 56 V84" stroke-dasharray="4 6">
          <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/>
        </path>
        <path d="M150 140 V168" stroke-dasharray="4 6">
          <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- Interface -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5s" repeatCount="indefinite"/>
        <rect x="30" y="0" width="240" height="56" rx="12" fill="#ffffff" stroke="#a48bfb" stroke-opacity="0.6"/>
        <rect x="30" y="0" width="240" height="56" rx="12" fill="#a48bfb" fill-opacity="0.08"/>
        <circle cx="52" cy="28" r="6" fill="#a48bfb" filter="url(#glow)"/>
        <text x="70" y="24" font-size="13" fill="#111318" font-weight="600">Interface</text>
        <text x="70" y="42" font-size="11" fill="#9a9ca3">React · Next.js · Tailwind</text>
      </g>

      <!-- API -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5s" begin="0.8s" repeatCount="indefinite"/>
        <rect x="30" y="84" width="240" height="56" rx="12" fill="#ffffff" stroke="#5eead4" stroke-opacity="0.6"/>
        <rect x="30" y="84" width="240" height="56" rx="12" fill="#5eead4" fill-opacity="0.07"/>
        <circle cx="52" cy="112" r="6" fill="#5eead4" filter="url(#glow)"/>
        <text x="70" y="108" font-size="13" fill="#111318" font-weight="600">Servidor</text>
        <text x="70" y="126" font-size="11" fill="#9a9ca3">Node.js · Server Actions · REST</text>
      </g>

      <!-- DB -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5s" begin="1.6s" repeatCount="indefinite"/>
        <rect x="30" y="168" width="240" height="56" rx="12" fill="#ffffff" stroke="#38bdf8" stroke-opacity="0.6"/>
        <rect x="30" y="168" width="240" height="56" rx="12" fill="#38bdf8" fill-opacity="0.07"/>
        <circle cx="52" cy="196" r="6" fill="#38bdf8" filter="url(#glow)"/>
        <text x="70" y="192" font-size="13" fill="#111318" font-weight="600">Dados</text>
        <text x="70" y="210" font-size="11" fill="#9a9ca3">PostgreSQL · Supabase · RLS</text>
      </g>
    </g>

    <!-- bottom accent line -->
    <rect x="0" y="316" width="1200" height="4" fill="url(#accent)" opacity="0.9"/>
  </g>
</svg>

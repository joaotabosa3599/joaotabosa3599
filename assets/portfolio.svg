<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-label="Portfólio">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15171c"/><stop offset="1" stop-color="#111318"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a48bfb" stop-opacity="0.22"/><stop offset="1" stop-color="#a48bfb" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="600" height="360" rx="20"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
  </defs>
  <g clip-path="url(#frame)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="600" height="360" fill="url(#card)"/>
    <rect width="600" height="360" fill="url(#grid)"/>
    <circle cx="470" cy="150" r="230" fill="url(#halo)"/>
    <rect x="0.5" y="0.5" width="599" height="359" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
    <circle cx="26" cy="24" r="4.5" fill="#f43f5e"/><circle cx="42" cy="24" r="4.5" fill="#f5c76f"/><circle cx="58" cy="24" r="4.5" fill="#34d399"/>
    <rect x="170" y="12" width="260" height="22" rx="11" fill="#ffffff" fill-opacity="0.05"/>
    <text x="300" y="27.5" text-anchor="middle" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="11" fill="#64666d">portfolio · react + framer motion</text>

    <g transform="translate(300 140)">
      <g transform="translate(-30 -20)">
        <animateTransform attributeName="transform" type="translate" values="-30 -20;-30 -26;-30 -20" dur="5s" repeatCount="indefinite"/>
        <rect x="-60" y="-70" width="190" height="130" rx="12" fill="#1a1d24" stroke="#ffffff" stroke-opacity="0.12"/>
        <rect x="-60" y="-70" width="190" height="24" rx="12" fill="#ffffff" fill-opacity="0.04"/>
        <circle cx="-46" cy="-58" r="3" fill="#f43f5e"/><circle cx="-36" cy="-58" r="3" fill="#f5c76f"/><circle cx="-26" cy="-58" r="3" fill="#34d399"/>
        <rect x="-44" y="-32" width="80" height="10" rx="5" fill="#f5f5f5" fill-opacity="0.85"/>
        <rect x="-44" y="-14" width="140" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>
        <rect x="-44" y="-2" width="110" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>
        <rect x="-44" y="18" width="56" height="20" rx="10" fill="#7f5af5"/>
        <rect x="18" y="18" width="56" height="20" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      </g>
      <g transform="translate(40 30)">
        <animateTransform attributeName="transform" type="translate" values="40 30;40 36;40 30" dur="5s" begin="0.6s" repeatCount="indefinite"/>
        <rect x="-50" y="-30" width="160" height="104" rx="12" fill="#15171c" stroke="#a48bfb" stroke-opacity="0.55"/>
        <rect x="-50" y="-30" width="160" height="104" rx="12" fill="#7f5af5" fill-opacity="0.08"/>
        <rect x="-36" y="-14" width="44" height="44" rx="10" fill="#a48bfb" fill-opacity="0.9" filter="url(#glow)"/>
        <path d="M-24 8 l6 -8 6 6 6 -10 6 12" fill="none" stroke="#111318" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="18" y="-12" width="76" height="8" rx="4" fill="#f5f5f5" fill-opacity="0.85"/>
        <rect x="18" y="4" width="60" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
        <rect x="18" y="16" width="70" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
        <rect x="-36" y="46" width="130" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>
      </g>
    </g>

    <g transform="translate(36 268)">
      <text font-size="30" font-weight="800" fill="#f5f5f5" letter-spacing="-0.8">Portfólio</text>
      <text y="28" font-size="14.5" fill="#9a9ca3">Estudos de caso dos projetos e histórico de experiência.</text>
    </g>
    <rect x="0" y="356" width="600" height="4" fill="#a48bfb"/>
  </g>
</svg>

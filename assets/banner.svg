<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="João Tabosa — Full Stack Developer">
  <title>João Tabosa — Full Stack Developer</title>

  <defs>
    <linearGradient id="stroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#101d33"/>
    </linearGradient>

    <clipPath id="rounded">
      <rect width="1200" height="240" rx="14"/>
    </clipPath>

    <style>
      .line {
        stroke-dasharray: 1500;
        stroke-dashoffset: 1500;
        animation: draw 1.6s cubic-bezier(.22,.61,.36,1) .15s forwards;
      }
      .tip { opacity: 0; animation: appear .4s ease-out 1.6s forwards; }
      @keyframes draw   { to { stroke-dashoffset: 0; } }
      @keyframes appear { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .line { animation: none; stroke-dashoffset: 0; }
        .tip  { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="240" fill="url(#panel)"/>

    <g stroke="#1e3a5f" stroke-width="1" opacity=".55">
      <line x1="0" y1="60"  x2="1200" y2="60"/>
      <line x1="0" y1="110" x2="1200" y2="110"/>
      <line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="210" x2="1200" y2="210"/>
    </g>

    <path fill="url(#area)"
      d="M0 190 L80 183 L160 196 L240 175 L320 181 L400 157 L480 166 L560 143
         L640 151 L720 125 L800 134 L880 104 L960 113 L1040 82 L1120 58 L1165 48
         L1200 48 L1200 240 L0 240 Z"/>

    <path class="line" fill="none" stroke="url(#stroke)" stroke-width="3"
      stroke-linecap="round" stroke-linejoin="round"
      d="M0 190 L80 183 L160 196 L240 175 L320 181 L400 157 L480 166 L560 143
         L640 151 L720 125 L800 134 L880 104 L960 113 L1040 82 L1120 58 L1165 48"/>

    <g class="tip">
      <circle cx="1165" cy="48" r="12" fill="#22d3ee" opacity=".22"/>
      <circle cx="1165" cy="48" r="5"  fill="#67e8f9"/>
    </g>

    <text x="64" y="116"
      font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="54" font-weight="700" fill="#f1f5f9" letter-spacing="-1">João Tabosa</text>

    <text x="66" y="152"
      font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="20" font-weight="500" fill="#7f9cc0">Full Stack Developer</text>
  </g>
</svg>
